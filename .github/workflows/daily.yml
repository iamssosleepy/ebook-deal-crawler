name: Daily ebook deals

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = only generate artifacts, 0 = update Google Sheets and Discord'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
      sources:
        description: 'Comma-separated sources'
        required: true
        default: 'readmoo,kobo,booksTw,pubu'
      discord_test_mode:
        description: 'Prefix Discord embed as TEST'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
  schedule:
    # 12:30 Asia/Taipei
    - cron: '30 4 * * *'

concurrency:
  group: ebook-deals-production
  cancel-in-progress: false

jobs:
  select-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner_label: ${{ steps.owner.outputs.runner_label }}
      taipei_date: ${{ steps.owner.outputs.taipei_date }}
    steps:
      - name: Select the explicitly approved weekend owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          taipei_date="$(TZ=Asia/Taipei date +%F)"
          case "$taipei_date" in
            2026-09-05|2026-09-06)
              runner_label=desktop
              ;;
            *)
              runner_label=laptop
              ;;
          esac
          echo "taipei_date=$taipei_date" >> "$GITHUB_OUTPUT"
          echo "runner_label=$runner_label" >> "$GITHUB_OUTPUT"
          echo "TAIPEI_DATE=$taipei_date OWNER=$runner_label"

  crawl:
    needs: select-owner
    # Eric explicitly approved a date-bounded exception for 2026-09-05 and
    # 2026-09-06. Every other date automatically stays on the XPS owner.
    runs-on: [self-hosted, linux, x64, ebook-deals, "${{ needs.select-owner.outputs.runner_label }}"]
    timeout-minutes: 20
    steps:
      - name: Verify the selected physical runner
        shell: bash
        env:
          SELECTED_OWNER: ${{ needs.select-owner.outputs.runner_label }}
          TAIPEI_DATE: ${{ needs.select-owner.outputs.taipei_date }}
          ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          set -euo pipefail
          case "$SELECTED_OWNER:$ACTUAL_RUNNER" in
            desktop:eric-desktop-wsl|laptop:eric-laptop-wsl)
              echo "OWNER_GUARD_OK date=$TAIPEI_DATE owner=$SELECTED_OWNER runner=$ACTUAL_RUNNER"
              ;;
            *)
              echo "OWNER_GUARD_REFUSED date=$TAIPEI_DATE owner=$SELECTED_OWNER runner=$ACTUAL_RUNNER" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Validate deployment environment
        run: npm run validate:deploy
        env:
          TZ: Asia/Taipei
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          REQUIRE_TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '0' || '1' }}
          GOOGLE_SHEET_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '' || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '' || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '' || secrets.DISCORD_WEBHOOK_URL }}
      - run: npm run crawl
        env:
          TZ: Asia/Taipei
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          SOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.sources || 'readmoo,kobo,booksTw,pubu' }}
          DISCORD_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.discord_test_mode || '0' }}
          FAIL_ON_SOURCE_ERROR: '0'
          REQUIRE_ALL_SOURCES: '1'
          MIN_DEALS: '10'
          GOOGLE_SHEET_TAB: 每日特價
          DISCORD_WEBHOOK_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '' || secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '' || secrets.DISCORD_THREAD_ID }}
          DISCORD_THREAD_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '' || secrets.DISCORD_THREAD_NAME }}
          GOOGLE_SHEET_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '' || secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && '' || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DELIVERY_STATE_DIR: /home/wch/.local/state/ebook-deal-crawler
          KOBO_LOCAL_JSONL: /home/wch/Projects/personal/kobo-weekly-book-list/data/books.jsonl
          BOOKS_TW_LOCAL_HTML: /home/wch/.cache/ai-workbench/books-tw.html
          BOOKS_TW_LOCAL_MAX_AGE_MINUTES: '360'
      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ebook-deal-reports
          path: output/
          if-no-files-found: warn
